services:
  salon:
    image: node:22
    container_name: le-salon
    working_dir: /app
    volumes:
      - .:/app
      - salon_node_modules:/app/node_modules
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      PORT: ${PORT:-3001}
    env_file:
      - path: .env
        required: false
    command: sh -c "npm install --no-package-lock && exec sleep infinity"
    stdin_open: true
    tty: true

volumes:
  salon_node_modules:
